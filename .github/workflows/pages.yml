name: Deploy page

on:
  push:
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the page
        run: |
          if [ ! -f index.html ]; then
            curl -fsSL "https://drive.usercontent.google.com/download?id=1DGIzZEyLbw5wVpk4rBMDysIpb-5IXJh5&export=download&confirm=t" -o index.html
          fi
          echo "3f93166b5a53f0c6164700cd818ca1d5119ceeacb1ad91f0f8591e2a22e83dd5  index.html" | sha256sum -c -
      - name: Keep a copy in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Add the Call Store page" && git push; fi
      - name: Prepare the site
        run: mkdir -p _site && cp index.html _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
