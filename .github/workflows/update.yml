name: Update page

on:
  push:
    paths: [".github/workflows/update.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the page changes
        env:
          PATCH: ""
        run: |
          python3 - <<'PY'
          import base64, gzip, json, hashlib, os
          NEW = "cb00331c0737c1bf55615ad7abd370e584be227eb66aa144d39d926a851a19d8"
          s = open("index.html", encoding="utf-8", newline="").read()
          if hashlib.sha256(s.encode()).hexdigest() != NEW:
              for old, new in json.loads(gzip.decompress(base64.b64decode(os.environ["PATCH"]))):
                  assert s.count(old) == 1, old[:60]
                  s = s.replace(old, new)
              open("index.html", "w", encoding="utf-8", newline="").write(s)
          assert hashlib.sha256(open("index.html", "rb").read()).hexdigest() == NEW
          PY
      - name: Save the updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Update the Call Store page" && git push; fi
      - name: Prepare the site
        run: mkdir -p _site && cp index.html _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
