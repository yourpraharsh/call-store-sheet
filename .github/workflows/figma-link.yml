name: Add Figma link

on:
  push:
    paths: [".github/workflows/figma-link.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the edit
        env:
          PATCH: ""
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, re
          R = r"data:[a-z/0-9+.-]+;base64,[A-Za-z0-9+/=]+"
          s = open("index.html", encoding="utf-8", newline="").read()
          us = re.findall(R, s); i = [0]
          def f(m):
              i[0] += 1; return "@@U%d@@" % i[0]
          s = re.sub(R, f, s); sp = []
          for pre, suf, new in json.loads(gzip.decompress(base64.b64decode(os.environ["PATCH"]))):
              assert s.count(pre) == 1, pre[:60]
              a0 = s.find(pre) + len(pre); a1 = s.find(suf, a0); assert a1 >= a0; sp.append((a0, a1, new))
          sp.sort(); out = []; cur = 0
          for a0, a1, new in sp:
              out.append(s[cur:a0]); out.append(new); cur = a1
          out.append(s[cur:]); s = "".join(out)
          s = re.sub(r"@@U(\d+)@@", lambda m: us[int(m.group(1)) - 1], s)
          assert "Open the Figma file" in s
          open("index.html", "w", encoding="utf-8", newline="").write(s); print("updated")

          PY
      - name: Save the page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Add Figma link" && git push; fi
      - run: mkdir -p _site && cp index.html _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
